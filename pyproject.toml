[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "enhanced-second-brain"
version = "0.1.0"
description = "Local-first OKF Markdown knowledge toolkit with FTS5, graph retrieval, usage telemetry, and reversible archival"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Enhanced Second Brain contributors"}]
keywords = ["second-brain", "okf", "fts5", "knowledge-management", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "filelock>=3.13",
  "mcp>=2,<3",
  "networkx>=3.2",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
esb = "enhanced_second_brain.cli:main"

[project.urls]
Homepage = "https://github.com/buffalodebile/enhanced-second-brain"
Repository = "https://github.com/buffalodebile/enhanced-second-brain"
Issues = "https://github.com/buffalodebile/enhanced-second-brain/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/enhanced_second_brain"]

[tool.hatch.build]
exclude = [
  "/.venv",
  "/.pytest_cache",
  "/.ruff_cache",
  "/build",
  "/dist",
  "/examples/**/_meta/cache",
  "/examples/**/_meta/usage.jsonl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["enhanced_second_brain"]
