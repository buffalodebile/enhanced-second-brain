name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: esb --vault examples/demo-vault okf audit
      - run: esb --vault examples/demo-vault benchmark examples/demo-vault/benchmark.json --max-p95-ms 2000

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv /tmp/esb-smoke
      - run: /tmp/esb-smoke/bin/pip install .
      - run: /tmp/esb-smoke/bin/python -m enhanced_second_brain --version
      - run: /tmp/esb-smoke/bin/esb --vault /tmp/new-brain install
      - run: test -f /tmp/new-brain/AGENTS.md
      - run: /tmp/esb-smoke/bin/esb --vault /tmp/new-brain context "installation verification"
      - run: /tmp/esb-smoke/bin/esb --vault /tmp/new-brain doctor

  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: enhanced-second-brain-linux-x64
            asset: dist/enhanced-second-brain-linux-x64
          - os: windows-latest
            name: enhanced-second-brain-windows-x64
            asset: dist/enhanced-second-brain-windows-x64.exe
          - os: macos-latest
            name: enhanced-second-brain-macos-arm64
            asset: dist/enhanced-second-brain-macos-arm64
          - os: macos-15-intel
            name: enhanced-second-brain-macos-x64
            asset: dist/enhanced-second-brain-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pyinstaller
      - run: python -m PyInstaller --onefile --name "${{ matrix.name }}" standalone.py
      - name: Test the agent-driven macOS/Linux installation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/esb-agent"
          cp "$PWD/${{ matrix.asset }}" "$RUNNER_TEMP/esb-agent/enhanced-second-brain"
          chmod +x "$RUNNER_TEMP/esb-agent/enhanced-second-brain"
          "$RUNNER_TEMP/esb-agent/enhanced-second-brain" --vault "$RUNNER_TEMP/SecondBrain" install
          "$RUNNER_TEMP/esb-agent/enhanced-second-brain" --vault "$RUNNER_TEMP/SecondBrain" context "installation verification"
          "$RUNNER_TEMP/esb-agent/enhanced-second-brain" --vault "$RUNNER_TEMP/SecondBrain" doctor
          test -f "$RUNNER_TEMP/SecondBrain/AGENTS.md"
          test -z "$(find "$RUNNER_TEMP/esb-agent" -type f -name 'python*' -print -quit)"
      - name: Test the agent-driven Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appHome = Join-Path $env:RUNNER_TEMP 'esb-agent'
          $vault = Join-Path $env:RUNNER_TEMP 'SecondBrain'
          New-Item -ItemType Directory -Path $appHome | Out-Null
          $engine = Join-Path $appHome 'enhanced-second-brain.exe'
          Copy-Item -LiteralPath '${{ matrix.asset }}' -Destination $engine
          & $engine --vault $vault install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $engine --vault $vault context 'installation verification'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $engine --vault $vault doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $vault 'AGENTS.md'))) { exit 1 }
          if (Get-ChildItem -LiteralPath $appHome -Recurse -Filter 'python*.exe') { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, smoke, standalone, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: enhanced-second-brain-*
          path: release-assets
          merge-multiple: true
      - name: Publish standalone release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-assets && sha256sum * > ../SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release-assets/* SHA256SUMS --generate-notes --title "Enhanced Second Brain $GITHUB_REF_NAME"
